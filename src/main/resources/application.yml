spring:
  application:
    name: keystone-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    time-zone: UTC

  # ---------------------------------------------------------------------
  # JPA / Hibernate
  # Kept minimal and provider-agnostic here; profile files override
  # environment-sensitive values (ddl-auto, show-sql, etc.)
  # ---------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, Hibernate must never auto-generate it
    open-in-view: false     # avoid lazy-loading in the view layer; enforce clean layering
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # ---------------------------------------------------------------------
  # Flyway
  # ---------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.keystone: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

# ---------------------------------------------------------------------
# Custom application-level placeholders.
# These will be populated with real logic in later phases
# (JWT secret/expiry, CORS origins for the React SPA, etc.)
# ---------------------------------------------------------------------
keystone:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
